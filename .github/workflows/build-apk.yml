name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KS: ${{ secrets.KS_B64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.13
        run: |
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" || echo "sdkmanager skipped"

      - name: Fetch Cairo font (best effort)
        run: |
          mkdir -p app/src/main/assets/www/fonts
          curl -fsSL -o app/src/main/assets/www/fonts/Cairo.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" || echo "font skipped"
          if [ -f app/src/main/assets/www/fonts/Cairo.ttf ] && [ "$(stat -c %s app/src/main/assets/www/fonts/Cairo.ttf)" -lt 10000 ]; then rm -f app/src/main/assets/www/fonts/Cairo.ttf; fi
          ls -la app/src/main/assets/www/fonts || true

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dettes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # اختياري: يعمل فقط إن أضفتَ أسرار التوقيع (KS_B64, KS_PASS, KS_ALIAS, KS_KEYPASS). لا يُفشل البناء أبدًا.
      - name: Build signed release APK (optional)
        if: env.HAS_KS == 'true'
        continue-on-error: true
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
          KS_KEYPASS: ${{ secrets.KS_KEYPASS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KS_FILE="$RUNNER_TEMP/release.keystore"
          gradle --no-daemon --stacktrace assembleRelease

      - name: Publish APKs as release (direct download)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dettes.apk
          FILES="dettes.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dettes-release.apk
            FILES="$FILES dettes-release.apk"
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest $FILES --target "${{ github.sha }}" --title "latest" --notes "build ${{ github.sha }}" --prerelease
