plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ryan.dettes'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ryan.dettes'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2.0'
    }

    // مفتاح تصحيح ثابت داخل المستودع (ليس سرًّا) حتى تتطابق توقيعات كل البنايات
    // ويُثبَّت كل APK جديد فوق القديم دون فقدان البيانات.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
