plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ryan.dettes'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ryan.dettes'
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName '0.7.0'
    }

    // مفتاح تصحيح ثابت داخل المستودع (ليس سرًّا) حتى تتطابق توقيعات كل البنايات
    // ويُثبَّت كل APK جديد فوق القديم دون فقدان البيانات.
    // توقيع release يتفعّل فقط حين تُمرَّر أسراره من GitHub Secrets (KS_FILE, KS_PASS, KS_ALIAS, KS_KEYPASS).
    def ksFile = System.getenv('KS_FILE')

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (ksFile) {
            release {
                storeFile file(ksFile)
                storePassword System.getenv('KS_PASS')
                keyAlias System.getenv('KS_ALIAS')
                keyPassword System.getenv('KS_KEYPASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
